services:
  voicevox_engine:
    image: voicevox/voicevox_engine:cpu-latest
    container_name: voicevox_engine
    # Bot はサービス名 voicevox_engine:50021 で内部到達するため外部公開は不要。
    # VOICEVOX の HTTP API は認証が無く、辞書変更も /synthesis による CPU 占有もできてしまうので、
    # ホストからの診断用に loopback だけへ絞る (LAN / Tailscale からは到達しない)。
    ports:
      - "127.0.0.1:50021:50021"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    container_name: yomiage_bot
    env_file: .env
    environment:
      # コンテナ間通信ではサービス名で VOICEVOX に到達する (.env の localhost を上書き)
      VOICEVOX_URL: http://voicevox_engine:50021
    volumes:
      # data/*.json (話者・辞書設定) を永続化
      - ./data:/app/data
    # 起動順を保証 (VOICEVOX が一時的に未応答でも Bot 側でフォールバックする)
    depends_on:
      - voicevox_engine
    restart: unless-stopped
    # 既定の json-file ドライバは上限を指定しないと無制限に肥大し、restart: unless-stopped で
    # 常駐する両サービスのログが削除されるまで積み上がる。ディスクが埋まると store.js の設定書き込みが
    # ENOSPC で失敗して /join などが落ちるため、上限を掛ける。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
